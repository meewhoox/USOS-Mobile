<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/icon.svg" alt="" width="32" height="32" />
      <h1 data-i18n="extName"></h1>
    </header>

    <section id="perm" hidden>
      <p data-i18n="permMissing"></p>
      <button type="button" id="perm-btn" class="primary" data-i18n="permGrant"></button>
    </section>

    <fieldset>
      <legend data-i18n="popupMode"></legend>
      <label><input type="radio" name="mode" value="auto" /> <span data-i18n="modeAuto"></span></label>
      <label><input type="radio" name="mode" value="always" /> <span data-i18n="modeAlways"></span></label>
      <label><input type="radio" name="mode" value="off" /> <span data-i18n="modeOff"></span></label>
    </fieldset>

    <fieldset>
      <legend data-i18n="popupTheme"></legend>
      <label><input type="radio" name="theme" value="default" /> <span data-i18n="themeDefault"></span></label>
      <label><input type="radio" name="theme" value="modern" /> <span data-i18n="themeModern"></span></label>
      <label><input type="radio" name="theme" value="dark" /> <span data-i18n="themeDark"></span></label>
    </fieldset>

    <a class="open" href="https://usosweb.polsl.pl/kontroler.php?_action=news/default" target="_blank" data-i18n="openUsos"></a>
    <script src="popup.js"></script>
  </body>
</html>
